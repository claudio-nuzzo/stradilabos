name: Crea ISO StradilabOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5

      - name: Controlla cataloghi e script
        run: |
          python3 -m unittest discover -v
          python3 scripts/validate_project.py

      - name: Prova il gestore delle finestre in X virtuale (Debian Trixie)
        run: |
          # Il test gira dentro lo stesso container Debian Trixie usato per la
          # build, così usa xfwm4 4.20 dei repository Debian 13 e non quello
          # dell'host Ubuntu del runner. Se fallisce, la build non parte.
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            debian:trixie-slim \
            sh -euc '
              sed -i "s/^Components: main$/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
              apt-get update
              apt-get install --yes --no-install-recommends \
                xfwm4 xvfb xfconf dbus-x11 x11-utils x11-apps greybird-gtk-theme
              sh scripts/test_window_manager_xvfb.sh
            '

      - name: Crea la ISO Debian ARM64 in ambiente isolato
        run: |
          docker run --rm --privileged \
            --env BUILD_ARCH=arm64 \
            --volume "$PWD:/work" \
            --workdir /work \
            debian:trixie-slim \
            sh -euc '
              sed -i "s/^Components: main$/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
              apt-get update
              apt-get install --yes live-build python3 squashfs-tools
              ./scripts/validate_debian_packages.sh
              ./auto/build
              ./scripts/validate_built_image.sh
            '

      - name: Prepara ISO e checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t iso_files < <(find . -maxdepth 1 -type f -name '*.hybrid.iso' -print)
          if (( ${#iso_files[@]} != 1 )); then
            echo "Attesa una sola ISO, trovate: ${#iso_files[@]}" >&2
            printf '%s\n' "${iso_files[@]}" >&2
            exit 1
          fi

          target="stradilabos-live-arm64.hybrid.iso"
          if [[ "${iso_files[0]}" != "./${target}" ]]; then
            mv "${iso_files[0]}" "${target}"
          fi

          sha256sum "${target}" > "${target}.sha256"
          ls -lh "${target}" "${target}.sha256"

      - name: Pubblica ISO e checksum
        uses: actions/upload-artifact@v6
        with:
          name: stradilabos-live-arm64
          path: |
            stradilabos-live-arm64.hybrid.iso
            stradilabos-live-arm64.hybrid.iso.sha256
          if-no-files-found: error
          retention-days: 1

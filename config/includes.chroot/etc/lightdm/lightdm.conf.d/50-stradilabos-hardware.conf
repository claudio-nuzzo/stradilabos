# LightDM 1.32 abilita per impostazione predefinita il controllo CanGraphical
# di systemd-logind. Alcune GPU virtuali (fra cui Parallels su ARM64) e alcuni
# adattatori di vecchi PC non pubblicano questa proprieta, pur essendo in grado
# di eseguire Xorg. In quel caso LightDM resta attivo senza avviare il desktop.
[LightDM]
logind-check-graphical=false

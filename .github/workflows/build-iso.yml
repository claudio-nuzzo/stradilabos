name: Crea ISO StradilabOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Controlla cataloghi e script
        run: |
          python3 -m unittest discover -v
          python3 scripts/validate_project.py

      - name: Crea la ISO Debian in ambiente isolato
        run: |
          docker run --rm --privileged \
            --volume "$PWD:/work" \
            --workdir /work \
            debian:trixie-slim \
            sh -lc '
              sed -i "s/^Components: main$/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
              apt-get update
              apt-get install --yes live-build python3 squashfs-tools
              ./scripts/validate_debian_packages.sh
              ./auto/build
              ./scripts/validate_built_image.sh
            '

      - name: Prepara ISO e checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t iso_files < <(find . -maxdepth 1 -type f -name '*.hybrid.iso' -print)
          if (( ${#iso_files[@]} != 1 )); then
            echo "Attesa una sola ISO, trovate: ${#iso_files[@]}" >&2
            printf '%s\n' "${iso_files[@]}" >&2
            exit 1
          fi

          target="stradilabos-live-amd64.hybrid.iso"
          if [[ "${iso_files[0]}" != "./${target}" ]]; then
            mv "${iso_files[0]}" "${target}"
          fi

          sha256sum "${target}" > "${target}.sha256"
          ls -lh "${target}" "${target}.sha256"

      - name: Pubblica ISO e checksum
        uses: actions/upload-artifact@v4
        with:
          name: stradilabos-live-amd64
          path: |
            stradilabos-live-amd64.hybrid.iso
            stradilabos-live-amd64.hybrid.iso.sha256
          if-no-files-found: error
          retention-days: 1
